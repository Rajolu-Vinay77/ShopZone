<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopZone</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#">Shop<span>Zone</span></a>
    <form class="search" id="searchForm">
      <select id="categoryFilter" aria-label="Category">
        <option value="all">All</option>
      </select>
      <input id="searchInput" type="search" placeholder="Search ShopZone" aria-label="Search products" />
      <button type="submit" aria-label="Search">&#128269;</button>
    </form>
    <button class="cart-btn" id="openCart" aria-label="Open cart">
      &#128722; Cart <span id="cartCount" class="badge">0</span>
    </button>
  </header>

  <section class="hero">
    <h1>Great deals on everything you need</h1>
    <p>Free shipping on orders over $50 (demo store)</p>
  </section>

  <main>
    <div class="toolbar">
      <span id="resultCount"></span>
      <label>Sort by
        <select id="sortSelect">
          <option value="featured">Featured</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="rating">Avg. Rating</option>
        </select>
      </label>
    </div>
    <div id="productGrid" class="grid"></div>
  </main>

  <div id="overlay" class="overlay hidden"></div>
  <aside id="cartPanel" class="cart-panel hidden" aria-label="Shopping cart">
    <div class="cart-head">
      <h2>Shopping Cart</h2>
      <button id="closeCart" aria-label="Close cart">&times;</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-foot">
      <div class="subtotal">Subtotal: <strong id="cartTotal">$0.00</strong></div>
      <button id="checkoutBtn" class="primary">Proceed to Checkout</button>
    </div>
  </aside>

  <div id="toast" class="toast hidden"></div>
  <footer>&copy; 2026 ShopZone &mdash; demo project, no real purchases.</footer>

  <script src="app.js"></script>
</body>
</html>
